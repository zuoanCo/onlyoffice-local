name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Workspace packages resolve through their published dist/ entries, so
      # the libraries have to be built before anything typechecks or imports them.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-node${{ matrix.node }}
          path: |
            packages/*/dist
          retention-days: 7
          if-no-files-found: ignore
